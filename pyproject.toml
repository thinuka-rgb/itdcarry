[project]
name = "itdcarry"
version = "0.1.0"
description = "Synthetic FLT3-ITD computational observability proof of concept"
requires-python = ">=3.11,<3.15"
dependencies = [
  "biopython>=1.83,<2",
  "daytona==0.211.2",
  "fastapi>=0.115,<1",
  "neo4j>=5.20,<7",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic-settings>=2.2,<3",
  "truststore>=0.10,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["backend*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
